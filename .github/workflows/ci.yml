name: 3DDX Clinical Engine CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  clinical-engineering-verification:
    name: Lint, Type-Check, Test, Build & Docker Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies Deterministically
        run: npm ci

      - name: Fast Architecture & Code Lint
        run: npm run lint

      - name: TypeScript Strict Type Check
        run: npx tsc -b

      - name: Automated Unit & Component Tests
        run: npm run test

      - name: Production Vite & WebGL Build
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "Production build verified successfully!"

      - name: Docker Container Image Build
        run: |
          docker build -t 3ddx-clinical-engine:ci .
          echo "Docker image built successfully in CI environment!"

      # Safe Integration Point: SonarQube Quality Scan
      # Blocked pending repository administrator / full-time developer provisioning:
      # - SONAR_HOST_URL (SonarQube Server / Cloud URL)
      # - SONAR_TOKEN (Authentication Token secret)
      # - SONAR_PROJECT_KEY (Registered Sonar project key)
      - name: SonarQube Scan (Safe Integration Point)
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "SonarQube credentials detected. Triggering analysis..."
