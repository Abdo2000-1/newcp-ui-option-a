        provenance. Financial writes require runtime F07 gates. Every service instance
        independently retains billability and intended payer.
    PatchServiceItem:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/FormAnswer'
        isRedo:
          type: boolean
        redoOfItemUuid:
          type: string
          format: uuid
        serviceNotes:
          type: string
        pendingReason:
          type: string
        billedToContactUuid:
          type: string
          format: uuid
          description: Change intended payer for this single service instance only
