openapi: 3.0.3
info:
  title: New CP — Service-Instance API (F07 + Billability + Q-B8..15 Approved Clarifications)
  version: 1.0.0
  description: 'Service-instance API contract for New CP, merging the foundation health
    probe, F07 per-item billed party target schema, Connect create-service fields,
    CP internal clerk editing controls, full pricing breakdown, V3 database schema
    validation, and the Technical Lead approved Q-B8 to Q-B15 clarifications (24 October
    2026: aggregate ETag/If-Match optimistic concurrency, atomic required hold details
    on workflow transition, authorized internal price override and zero-charge reasons,
    canonical field types and typed conditional rules, demo quantity default, and
    independent billability alongside F07 billed party). The migration and ETL are
    supplied as implementation artifacts; this document does NOT certify V204 deployment,
    dump-specific payer mapping, stage-90 reconciliation, downstream finance updates,
    tenant catalog mappings or live integration tests.'
servers:
- url: http://localhost:3000
  description: Local New CP backend; URL example, not a verified deployment
x-contract-status: APPROVED_QB8_QB15_IMPLEMENTATION_TARGET; F07_AND_LIVE_API_UNVERIFIED;
  NOT_FINAL
x-source-authority:
- Connect Add/Create Service form fields/validators
- CP internal editing behavior
- Sanitized PostgreSQL V3 migrations V008 V011 V013 V020 V100 V130
- 'October demo decisions: multiple same-type instances'
- F07 supplied remediation V204 + stage-30/stage-90 source; runtime not executed by
  this handoff
- 'User confirmation 23 October 2026: retain is_billable alongside F07 service payer
  columns'
- Technical Lead approvals Q-B8–Q-B15, 24 October 2026; service-specific and role-specific
  verification still pending
x-blockers:
- Actual V3 applied migration V204 and non-null payer finalization require read-only
  verification of deployed schema
- ETL policy approved against exact MySQL source domain and stage-90 reconciliation
  need owner evidence
- Selected tenant catalog codes/UUIDs and field mapping remain unverified
- Actual state transitions and role checks remain unverified
- Financial charging/price/voucher/invoice code must be validated against persisted
  order item payer
- No backend or both React app live integration evidence available
- Independent legacy is_billable source mapping not yet evidenced; stage30 uses documented
  true default when no explicit reliable billability source exists
- Aggregate service revision strategy and DB migration decision pending backend owner
  design review
- Actual hold reason values temporary synthetic nonproduction only; historical lookup
  approval pending
- Actual CP edit price permission, money currency precision and role permissions must
  be verified in implementation
tags:
- name: System
  description: Infrastructure liveness and readiness probes
- name: Catalog
- name: Service Instances
- name: Workflow
- name: Lookups
  description: System lookup values such as zero-charge reasons and hold reasons
security:
- BearerAuth: []
paths:
  /health:
    get:
      tags:
      - System
      summary: Liveness/readiness probe
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                - status
  /api/v1/catalog/services:
    get:
      tags:
      - Catalog
      operationId: listDemoCatalogServices
      summary: List authorized sellable service options (tenant scoped)
      parameters:
      - in: query
        name: categoryCode
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogService'
        '400':
          description: Bad request / invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Not found or masked by tenant access
        '409':
          description: Business state conflict
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/catalog/services/{serviceUuid}/form-schema:
    get:
      tags:
      - Catalog
      operationId: getServiceFormSchema
      summary: Get actual tenant catalog field and condition metadata
      parameters:
      - in: path
        name: serviceUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinition'
        '400':
          description: Bad request / invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Not found or masked by tenant access
        '409':
          description: Business state conflict
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/orders/{orderUuid}/services:
    get:
      tags:
      - Service Instances
      operationId: listOrderServiceItems
      summary: List independent service instances on an authorized order
      parameters:
      - in: path
        name: orderUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceItem'
        '400':
          description: Bad request / invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Not found or masked by tenant access
        '409':
          description: Business state conflict
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Service Instances
      operationId: createOrderServiceItem
      summary: Create a new independent service instance on an order
      description: Create a new independent service-instance UUID even when same sellable
        item already exists. Server enforces field rules, authorization and tenant-scoped
        transaction. Idempotency-Key proposal requires explicit policy confirmation;
        intentional second submissions use distinct keys.
      parameters:
      - in: path
        name: orderUuid
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Proposed retry protection; exact retention/replay policy is a
          technical decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceItem'
      responses:
        '201':
          description: Created service item
          headers:
            ETag:
              description: Initial opaque revision of the created service aggregate.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
        '400':
          description: Bad request / invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Not found or masked by tenant access
        '409':
          description: Business state conflict
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/services/{serviceItemUuid}:
    get:
      tags:
      - Service Instances
      operationId: getServiceItem
      summary: Get a single service instance with ETag aggregate revision
      description: Return ETag covering the entire editable service state. Implementation
        must update revision on child field/workflow writes, not only order_items.updated_at.
      parameters:
      - in: path
        name: serviceItemUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Opaque revision of the entire editable service aggregate
                (including fields/workflow). Store and send on next write.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
        '400':
          description: Bad request / invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Not found or masked by tenant access
        '409':
          description: Business state conflict
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - Service Instances
      operationId: patchServiceItem
      summary: Update a service instance with If-Match concurrency guard
      description: Requires If-Match; approved CP authorized unitPrice overrides must
        not be silently replaced with contract rate. Preserve zero-charge reason required
        at final line_total zero and financial locks.
      parameters:
      - in: path
        name: serviceItemUuid
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: ETag of loaded service aggregate. Required on mutations. 412
          if stale, 428 if absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchServiceItem'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Opaque revision of the entire editable service aggregate
                (including fields/workflow). Store and send on next write.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
        '400':
          description: Bad request / invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Not found or masked by tenant access
        '409':
          description: Business state conflict
        '412':
          description: 'Stale version: changed by another user, no write occurred'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: Missing required If-Match precondition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/services/{serviceItemUuid}/available-transitions:
    get:
      tags:
      - Workflow
      operationId: listServiceTransitions
      summary: List currently authorized manual workflow transitions
      description: Return currently authorized manual transitions from selected workflow
        instance. Do not hardcode legacy numeric statuses.
      parameters:
      - in: path
        name: serviceItemUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableTransition'
        '400':
          description: Bad request / invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Not found or masked by tenant access
        '409':
          description: Business state conflict
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/services/{serviceItemUuid}/transitions:
    post:
      tags:
      - Workflow
      operationId: advanceServiceWorkflow
      summary: Execute an atomic workflow state transition with If-Match guard
      description: Requires If-Match; when destination is on_hold, mandatory holdType
        + holdReasonCode; commit service status, hold details and history in one DB
        transaction. Temporary lookup reason choices are for authorized test/demo
        environments only.
      parameters:
      - in: path
        name: serviceItemUuid
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: ETag of loaded service aggregate. Required on mutations. 412
          if stale, 428 if absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: New aggregate version after atomic transition
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResult'
        '400':
          description: Bad request / invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Not found or masked by tenant access
        '409':
          description: Business state conflict
        '412':
          description: 'Stale version: changed by another user, no write occurred'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: Missing required If-Match precondition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/services/{serviceItemUuid}/history:
    get:
      tags:
      - Workflow
      operationId: getServiceHistory
      summary: Get status and workflow transition history for a service instance
      parameters:
      - in: path
        name: serviceItemUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEvent'
        '400':
          description: Bad request / invalid field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Not found or masked by tenant access
        '409':
          description: Business state conflict
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/orders/{orderUuid}/eligible-billed-parties:
    get:
      tags:
      - Service Instances
      operationId: listEligibleOrderItemBilledParties
      summary: List eligible service-level billed parties for one authorized order
      description: Resolve order Doctor/default and Scanning Center within tenant
        and staff permission, return contact UUIDs for selection; do not return unrestricted
        contacts. Endpoint proposal until backend contract review.
      parameters:
      - in: path
        name: orderUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Eligible billed parties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BilledPartyChoice'
        '401':
          description: Not authenticated
        '403':
          description: Denied
        '404':
          description: Order not found or tenant-masked
  /api/v1/catalog/hold-reasons:
    get:
      tags:
      - Catalog
      - Lookups
      operationId: listEligibleHoldReasons
      summary: Return configured hold reasons; temporary synthetic choices are nonproduction
        only
      description: Returns valid hold reasons filtered by holdType (customer or internal)
        for atomic on_hold workflow transitions (Q-B9).
      parameters:
      - in: query
        name: holdType
        required: true
        schema:
          $ref: '#/components/schemas/HoldType'
        description: Required hold type filter (customer or internal)
      responses:
        '200':
          description: Configured hold reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldReasonOption'
        '401':
          description: Not authenticated
        '403':
          description: Denied
  /api/v1/lookups/zero-charge-reasons:
    get:
      tags:
      - Lookups
      operationId: listZeroChargeReasons
      summary: List active zero charge reasons
      description: Returns active reasons required when an order item line total is
        $0.00 to satisfy DB constraint ck_order_items__zero_charge_has_reason (Q-B10).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZeroChargeReason'
        '401':
          description: Not authenticated
        '403':
          description: Denied
  /api/v1/lookups/hold-reasons:
    get:
      tags:
      - Lookups
      operationId: listHoldReasons
      summary: List active hold reasons (lookup alias for /api/v1/catalog/hold-reasons)
      description: Returns valid reasons when placing an item on hold with customer
        or internal hold type; temporary synthetic choices are nonproduction only.
      parameters:
      - in: query
        name: holdType
        required: false
        schema:
          $ref: '#/components/schemas/HoldType'
        description: Filter reasons by hold type (customer or internal)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldReasonOption'
        '401':
          description: Not authenticated
        '403':
          description: Denied
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque or JWT per approved Google Auth adapter
  schemas:
    Problem:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          properties:
            field:
              type: string
            reason:
              type: string
          additionalProperties: true
          description: For ZERO_CHARGE_REASON_REQUIRED (422), details.field must equal
            zeroChargeReasonCode; other errors may include structured code-specific
            detail.
    FormOption:
      type: object
      required:
      - code
      - label
      properties:
        code:
          type: string
        label:
          type: string
        active:
          type: boolean
    CatalogService:
      type: object
      required:
      - uuid
      - code
      - name
      - itemKind
      properties:
        uuid:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        itemKind:
          type: string
          enum:
          - service
        isDigital:
          type: boolean
        workflowCode:
          type: string
          nullable: true
    CanonicalFieldType:
      type: string
      enum:
      - text
      - number
      - boolean
      - date
      - single_select
      - multi_select
      - file
      - tooth_chart
      description: Data types allowed by V3 catalog.field_types.data_type (Q-B11),
        verify actual seeded code values; UI widgets such as radio vs select are presentation-only.
    FormValidation:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        max_length:
          type: integer
          minimum: 0
        pattern:
          type: string
      additionalProperties: true
      description: Known V3 validation keys (Q-B12); backend must review actual existing
        JSON configurations before freezing full key vocabulary.
    FieldCondition:
      oneOf:
      - $ref: '#/components/schemas/FieldConditionLeaf'
      - $ref: '#/components/schemas/FieldConditionAll'
      - $ref: '#/components/schemas/FieldConditionAny'
      - $ref: '#/components/schemas/FieldConditionNot'
    FieldConditionLeaf:
      type: object
      required:
      - op
      additionalProperties: false
      properties:
        field:
          type: string
        attribute:
          type: string
        op:
          type: string
          enum:
          - eq
          - ne
          - in
          - not_in
          - is_set
          - is_not_set
          - gt
          - gte
          - lt
          - lte
        value: {}
        values:
          type: array
          items: {}
      description: Exactly one of field/attribute; field codes resolved using tenant
        catalog; value vs values depends on op; enforce with application validator.
    FieldConditionAll:
      type: object
      required:
      - all
      additionalProperties: false
      properties:
        all:
          type: array
          items:
            $ref: '#/components/schemas/FieldCondition'
    FieldConditionAny:
      type: object
      required:
      - any
      additionalProperties: false
      properties:
        any:
          type: array
          items:
            $ref: '#/components/schemas/FieldCondition'
    FieldConditionNot:
      type: object
      required:
      - not
      additionalProperties: false
      properties:
        not:
          $ref: '#/components/schemas/FieldCondition'
    ConditionalFieldRule:
      type: object
      required:
      - ruleKind
      - condition
      properties:
        ruleKind:
          type: string
          enum:
          - visible
          - required
          - options
        condition:
          $ref: '#/components/schemas/FieldCondition'
        optionCodes:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
        active:
          type: boolean
      description: Rule kind, ordered options precedence and conditional expression
        V3-derived (Q-B12); server evaluator authoritative.
    FormField:
      type: object
      required:
      - uuid
      - code
      - label
      - type
      - required
      - options
      properties:
        uuid:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        type:
          $ref: '#/components/schemas/CanonicalFieldType'
        required:
          type: boolean
        defaultValue:
          type: string
          nullable: true
        validation:
          $ref: '#/components/schemas/FormValidation'
        conditionalRules:
          type: array
          items:
            $ref: '#/components/schemas/ConditionalFieldRule'
        options:
          type: array
          items:
            $ref: '#/components/schemas/FormOption'
    FormDefinition:
      type: object
      required:
      - service
      - fields
      properties:
        service:
          $ref: '#/components/schemas/CatalogService'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
        evidence:
          type: string
          description: Indicates whether tenant runtime mapping is verified
    FormAnswer:
      type: object
      required:
      - fieldCode
      properties:
        fieldCode:
          type: string
          description: Stable machine code of the form question (from catalog.fields.code)
        value:
          description: 'Natural polymorphic answer value for free-form inputs: string
            (text or ISO date), number, or boolean. Backend validates and maps to
            appropriate SQL column.'
          oneOf:
          - type: string
          - type: number
          - type: boolean
        optionCodes:
          type: array
          items:
            type: string
          description: 'Unified option codes array for choice-based fields: single-select
            fields supply 1 element e.g. ["FORMLABS_3B"], multi-select fields supply
            multiple elements e.g. ["UPPER", "LOWER"], and unselected/cleared fields
            supply [].'
        optionCode:
          type: string
          description: Compatibility single-select option code (used by v0.9.2 shared
            TS client); backend normalizes with optionCodes.
        valueText:
          type: string
          description: Compatibility text carrier (used by v0.9.2 shared TS client).
        valueNumber:
          type: number
          description: Compatibility numeric carrier (used by v0.9.2 shared TS client).
        valueBoolean:
          type: boolean
          description: Compatibility boolean carrier (used by v0.9.2 shared TS client).
        valueDate:
          type: string
          format: date
          description: Compatibility date carrier (used by v0.9.2 shared TS client).
      description: Form answer model supporting both the clean polymorphic value +
        optionCodes array (Section 4 Strategy 1 & Section 5 Approach A) and the v0.9.2
        shared client typed carriers. Validation is performed from tenant catalog
        + source-evidenced rules, including conditional requiredness.
    CreateServiceItem:
      type: object
      required:
      - sellableItemUuid
      - answers
      properties:
        sellableItemUuid:
          type: string
          format: uuid
        answers:
          type: array
          items:
            $ref: '#/components/schemas/FormAnswer'
        isRedo:
          type: boolean
          default: false
        redoOfItemUuid:
          type: string
          format: uuid
        serviceNotes:
          type: string
        billedToContactUuid:
          type: string
          format: uuid
          description: Optional selected payer for THIS item; when omitted creation
            copies order default ONCE. Must be eligible for the specific order and
            tenant.
        isBillable:
          type: boolean
          default: true
          description: Independent service-instance billability (Q-B14); true = chargeable/billable,
            false = never invoiced per V3 column definition. Not the Doctor/Scanning
            Center payer selection; never map legacy toBeBilled to this flag. Changes
            require clerk permission and are financially locked once charged/invoiced.
        unitPrice:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: Authorized CP-adjustable per-unit monetary price, decimal string
            (Q-B10). Backend supplies contract-based initial value, then accepts permitted
            clerk override without silently re-pricing it to contract amount. Enforce
            currency scale, audit and financial locks; do not trust unprivileged writers.
        quantity:
          type: number
          minimum: 0.001
          multipleOf: 0.001
          default: 1
          description: 'Selected demo workflows default to 1 (Q-B13). Do NOT interpret
