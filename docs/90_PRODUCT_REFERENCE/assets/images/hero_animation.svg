<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d8fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowBadge" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.02); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.7; }
      100% { transform: translateY(380px); opacity: 0.1; }
    }
    @keyframes badgeOrbit {
      0% { transform: rotate(0deg) translate(80px) rotate(0deg); }
      100% { transform: rotate(360deg) translate(80px) rotate(-360deg); }
    }
    @keyframes floatTooth {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .pulse-glow { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .scan-line { animation: scanLine 6s linear infinite; }
    .float-tooth { animation: floatTooth 3s ease-in-out infinite; }
    .tech-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; }
  </style>

  <!-- Deep Clinical Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" />

  <!-- Animated Laser Scan Line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00d8fe" stroke-width="2" opacity="0.4" class="scan-line" filter="url(#glowCyan)" />

  <!-- Ambient Glowing Blobs -->
  <circle cx="150" cy="190" r="140" fill="#00d8fe" opacity="0.08" filter="url(#glowCyan)" />
  <circle cx="1050" cy="190" r="140" fill="#6366f1" opacity="0.08" filter="url(#glowCyan)" />

  <!-- LEFT: 3D CLINICAL TOOTH SCHEMATIC EMBLEM -->
  <g transform="translate(140, 190)" class="float-tooth">
    <!-- Outer Orbital Rings -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="url(#accentCyan)" stroke-width="2" opacity="0.7" transform="rotate(-25)" />

    <!-- Sculpted Molar Silhouette -->
    <!-- Crown -->
    <path d="M -35 -10 C -38 -30 -30 -45 -18 -45 C -10 -45 -4 -38 0 -38 C 4 -38 10 -45 18 -45 C 30 -45 38 -30 35 -10 C 32 5 24 10 18 10 C 12 10 0 5 0 5 C 0 5 -12 10 -18 10 C -24 10 -32 5 -35 -10 Z"
          fill="#f4eee4" stroke="#ffffff" stroke-width="2" filter="url(#glowCyan)" />
    <!-- Root 1 (Mesial) -->
    <path d="M -24 10 C -28 25 -32 45 -22 62 C -18 68 -12 68 -14 58 C -18 42 -14 25 -8 10 Z"
          fill="#c88c5f" stroke="#b77c50" stroke-width="1.5" />
    <!-- Root 2 (Distal) -->
    <path d="M 24 10 C 28 25 32 45 22 62 C 18 68 12 68 14 58 C 18 42 14 25 8 10 Z"
          fill="#c88c5f" stroke="#b77c50" stroke-width="1.5" />
    <!-- Occlusal Green Number Badge -->
    <circle cx="0" cy="-22" r="13" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#glowBadge)" />
    <text x="0" y="-17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="900" font-family="'JetBrains Mono', monospace">8</text>
  </g>

  <!-- CENTER: HERO TITLE & SPECIFICATIONS -->
  <g transform="translate(340, 110)">
    <!-- Top Clinical Badge Pill -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="rgba(0, 216, 254, 0.12)" stroke="rgba(0, 216, 254, 0.4)" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#00d8fe" filter="url(#glowCyan)" />
    <text x="28" y="19" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1.5" class="tech-font">CLINICAL DENTAL ENGINE • V4.2 PRO</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#ffffff" font-size="38" font-weight="900" letter-spacing="-0.5" class="tech-font">
      3DDX Anatomical Odontogram
    </text>
    <text x="0" y="112" fill="url(#accentCyan)" font-size="28" font-weight="800" letter-spacing="0.5" class="tech-font">
      &amp; 3D Biomechanical Dental Arch System
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="145" fill="#94a3b8" font-size="14.5" font-weight="500" class="tech-font">
      Photorealistic 32-Tooth Human Dentition • Surgical Titanium Implants • Dual ISO / ADA Numbering
    </text>

    <!-- Author & Supervisor Attribution Pill -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="560" height="42" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
      
      <!-- Lead Engineer -->
      <circle cx="20" cy="21" r="8" fill="#38bdf8" />
      <text x="36" y="26" fill="#f1f5f9" font-size="13" font-weight="700" class="tech-font">
        Lead Engineer: <tspan fill="#38bdf8">Abdo Al Adawy</tspan>
      </text>

      <line x1="280" y1="8" x2="280" y2="34" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1" />

      <!-- Supervisor -->
      <circle cx="304" cy="21" r="8" fill="#a855f7" />
      <text x="320" y="26" fill="#f1f5f9" font-size="13" font-weight="700" class="tech-font">
        Supervisor: <tspan fill="#c084fc">Eng. Aya Adel</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT: 4 PILLARS QUICK STATS -->
  <g transform="translate(940, 75)">
    <!-- Card 1: 3D Orbit -->
    <rect x="0" y="0" width="210" height="52" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="18" y="24" fill="#38bdf8" font-size="13" font-weight="800" class="tech-font">360° Smooth Orbit</text>
    <text x="18" y="42" fill="#64748b" font-size="11" font-weight="600" class="tech-font">WebGL 2.0 • 60 FPS Damped</text>

    <!-- Card 2: Clinical Accuracy -->
    <rect x="0" y="62" width="210" height="52" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
    <text x="18" y="86" fill="#10b981" font-size="13" font-weight="800" class="tech-font">Clinical Morphology</text>
    <text x="18" y="104" fill="#64748b" font-size="11" font-weight="600" class="tech-font">1:1 Photographic Match</text>

    <!-- Card 3: Titanium Implants -->
    <rect x="0" y="124" width="210" height="52" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(251, 191, 36, 0.2)" stroke-width="1" />
    <text x="18" y="148" fill="#fbbf24" font-size="13" font-weight="800" class="tech-font">Surgical Implants</text>
    <text x="18" y="166" fill="#64748b" font-size="11" font-weight="600" class="tech-font">Grade-5 Titanium Fixtures</text>

    <!-- Card 4: Bilingual Engine -->
    <rect x="0" y="186" width="210" height="52" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1" />
    <text x="18" y="210" fill="#c084fc" font-size="13" font-weight="800" class="tech-font">Bilingual RTL / LTR</text>
    <text x="18" y="228" fill="#64748b" font-size="11" font-weight="600" class="tech-font">Arabic • English • Day/Night</text>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="374" width="1200" height="6" fill="url(#accentCyan)" />
</svg>
